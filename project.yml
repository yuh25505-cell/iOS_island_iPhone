name: IslandPhone
options:
  bundleIdPrefix: com.island
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.5.1"
    CURRENT_PROJECT_VERSION: "6"
targets:
  IslandPhone:
    type: application
    platform: iOS
    sources:
      - path: IslandPhone
        excludes:
          - "**/.gitkeep"
    preBuildScripts:
      - name: Make App Icon
        basedOnDependencyAnalysis: false
        script: |
          ICON="$SRCROOT/IslandPhone/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          CUSTOM="$SRCROOT/Tools/AppIcon.png"
          if [ -f "$CUSTOM" ]; then
            TMP="$(mktemp -d)"
            if sips -z 1024 1024 -s format jpeg "$CUSTOM" --out "$TMP/a.jpg" >/dev/null && sips -s format png "$TMP/a.jpg" --out "$ICON" >/dev/null; then
              exit 0
            fi
          fi
          for PY in /usr/bin/python3 /opt/homebrew/bin/python3 /usr/local/bin/python3 python3; do
            if command -v "$PY" >/dev/null 2>&1; then
              "$PY" "$SRCROOT/Tools/make_icon.py" "$ICON" && exit 0
            fi
          done
          echo "error: cannot make app icon"
          exit 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.island.phone
        PRODUCT_NAME: IslandPhone
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Island
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  IslandPhone:
    build:
      targets:
        IslandPhone: all
